<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kairozen Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0B0F1F;
    --bg-1:#131A33;
    --bg-2:#1B2247;
    --line:#2A3260;
    --violet:#7C5CFF;
    --violet-soft:rgba(124,92,255,.16);
    --gold:#F5C542;
    --ink:#F5F6FA;
    --ink-dim:#9AA0C3;
    --danger:#E5545C;
    --success:#33D69F;
    --radius:18px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg-0); overscroll-behavior:none;}
  body{
    font-family:'Kantumruy Pro','Space Grotesk',sans-serif;
    color:var(--ink);
    display:flex; flex-direction:column;
  }
  .num{font-family:'Space Grotesk','Kantumruy Pro',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* icon system (Lucide SVGs) — replaces emoji everywhere for a consistent, crisp look */
  svg.lucide{display:block; stroke-width:2;}
  .ic{display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
  .ic svg{width:1em; height:1em;}
  .ic-18{font-size:18px;} .ic-20{font-size:20px;} .ic-24{font-size:24px;} .ic-28{font-size:28px;} .ic-34{font-size:34px;}
  .icon-tile{
    width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center;
    background:var(--violet-soft); color:var(--gold); font-size:22px;
  }
  .card-img{
    width:100%; aspect-ratio:1.6/1; border-radius:13px; object-fit:cover; background:var(--bg-2); display:block;
  }
  .thumb-sm{width:38px; height:38px; border-radius:11px; object-fit:cover; display:block; background:var(--bg-2);}
  .img-upload{
    display:flex; align-items:center; gap:12px; margin-top:6px;
  }
  .img-upload .preview{
    width:64px; height:64px; border-radius:14px; object-fit:cover; background:var(--bg-2); border:1px solid var(--line);
  }
  .img-upload label{
    border:1px dashed var(--line); border-radius:12px; padding:9px 14px; font-size:12.5px; color:var(--ink-dim);
    cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .img-upload input[type=file]{display:none;}

  #app{display:flex; flex-direction:column; min-height:100vh;}

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    padding:calc(14px + var(--safe-t)) 18px 14px;
    background:linear-gradient(160deg, var(--bg-1), var(--bg-2) 130%);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand .mark{
    font-family:'Space Grotesk'; font-weight:700; font-size:19px; letter-spacing:.2px;
    display:flex; align-items:center; gap:7px;
  }
  .brand .mark .dot{width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold);}
  .brand .sub{font-size:11.5px; color:var(--ink-dim); letter-spacing:.3px;}
  .wallet-chip{
    display:flex; align-items:center; gap:7px;
    background:var(--violet-soft); border:1px solid rgba(124,92,255,.4);
    padding:8px 13px; border-radius:999px; cursor:pointer; color:var(--gold);
  }
  .wallet-chip .amt{font-family:'Space Grotesk'; font-weight:600; font-size:14.5px; color:var(--ink);}

  main{flex:1; overflow-y:auto; padding-bottom:calc(84px + var(--safe-b));}
  .view{display:none; padding:16px 16px 8px;}
  .view.active{display:block; animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

  .section-title{
    font-size:12.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:1.2px;
    margin:18px 2px 10px; font-weight:600;
  }
  .section-title:first-child{margin-top:2px;}

  /* ---------- product grid ---------- */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .card{
    background:var(--bg-1); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden;
  }
  .card .name{font-size:14px; font-weight:600; line-height:1.35; min-height:38px;}
  .card .meta{display:flex; align-items:center; justify-content:space-between; margin-top:2px;}
  .card .price{font-family:'Space Grotesk'; font-weight:700; font-size:16.5px; color:var(--gold);}
  .stock-pill{
    display:inline-flex; align-items:center; gap:4px;
    font-size:10.5px; padding:3px 8px 3px 6px; border-radius:999px; font-weight:600; width:fit-content;
    background:rgba(51,214,159,.12); color:var(--success);
  }
  .stock-pill.low{background:rgba(229,84,92,.14); color:var(--danger);}
  .buy-btn{
    margin-top:6px; border:none; border-radius:12px; padding:10px; font-weight:600; font-size:13.5px;
    background:var(--violet); color:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .buy-btn:disabled{background:var(--bg-2); color:var(--ink-dim);}

  /* ---------- wallet ---------- */
  .balance-hero{
    background:linear-gradient(150deg, var(--bg-1), var(--bg-2) 140%);
    border:1px solid var(--line); border-radius:22px; padding:22px 20px; text-align:center;
    position:relative; overflow:hidden;
  }
  .balance-hero .ring{
    position:absolute; width:220px; height:220px; border:1px solid rgba(255,255,255,.06); border-radius:50%;
    top:-90px; right:-70px;
  }
  .balance-hero .label{font-size:12px; color:var(--ink-dim); letter-spacing:1px; text-transform:uppercase;}
  .balance-hero .value{font-family:'Space Grotesk'; font-weight:700; font-size:38px; margin:6px 0 2px;}
  .balance-hero .ref{font-size:11.5px; color:var(--ink-dim);}

  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .amt-chip{
    flex:1; min-width:64px; text-align:center; padding:10px 6px; border-radius:12px;
    background:var(--bg-1); border:1px solid var(--line); font-family:'Space Grotesk'; font-weight:600;
    cursor:pointer; font-size:13.5px;
  }
  .amt-chip.active{border-color:var(--gold); color:var(--gold); background:rgba(245,197,66,.08);}
  .custom-amt{display:flex; gap:8px; margin-top:10px;}
  .custom-amt input{
    flex:1; background:var(--bg-1); border:1px solid var(--line); border-radius:12px; color:var(--ink);
    padding:11px 12px; font-family:'Space Grotesk'; font-size:14px;
  }
  .primary-btn{
    width:100%; border:none; border-radius:14px; padding:13px; font-weight:700; font-size:14.5px;
    background:var(--violet); color:#fff; margin-top:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }

  /* ---------- ticket (QR receipt) ---------- */
  .ticket{
    margin-top:16px; background:#fff; color:#0B0F1F; border-radius:16px; position:relative;
    padding:18px 18px 22px; text-align:center;
  }
  .ticket .notch{position:absolute; width:20px; height:20px; background:var(--bg-0); border-radius:50%; top:50%; margin-top:-10px;}
  .ticket .notch.l{left:-10px;} .ticket .notch.r{right:-10px;}
  .ticket .perf{border-top:2px dashed #d8d8e0; margin:14px 0;}
  .ticket .store{font-family:'Space Grotesk'; font-weight:700; font-size:13.5px; letter-spacing:.3px;}
  .ticket .amt{font-family:'Space Grotesk'; font-weight:700; font-size:26px; margin:10px 0 4px; color:#1B2247;}
  .ticket img{width:100%; max-width:220px; border-radius:8px; margin:8px auto;}
  .ticket .refid{font-size:11px; color:#7a7d92; letter-spacing:.5px;}
  .ticket .status-line{
    margin-top:12px; font-size:12.5px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .spinner{
    width:13px; height:13px; border-radius:50%; border:2px solid #d8d8e0; border-top-color:var(--violet);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .status-line.ok{color:var(--success);}
  .status-line.fail{color:#E5545C;}

  /* ---------- orders ---------- */
  .order-row{display:flex; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line); align-items:center;}
  .order-row:last-child{border-bottom:none;}
  .order-row .o-name{font-weight:600; font-size:14px;}
  .order-row .o-meta{font-size:12px; color:var(--ink-dim); margin-top:3px;}
  .order-row .o-price{font-family:'Space Grotesk'; font-weight:700; color:var(--gold); margin-left:auto; font-size:14.5px;}

  .empty{text-align:center; padding:50px 20px; color:var(--ink-dim);}
  .empty .ic{margin:0 auto 12px; color:var(--ink-dim); opacity:.6;}

  /* ---------- tabbar ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:rgba(19,26,51,.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    display:flex; padding:8px 10px calc(8px + var(--safe-b));
  }
  .tabbar button{
    flex:1; background:none; border:none; color:var(--ink-dim); display:flex; flex-direction:column;
    align-items:center; gap:3px; font-size:10.5px; padding:6px 0; cursor:pointer; font-family:inherit;
  }
  .tabbar button.active{color:var(--gold);}

  /* ---------- modal ---------- */
  .sheet-overlay{position:fixed; inset:0; background:rgba(4,6,15,.6); z-index:40; display:none; align-items:flex-end;}
  .sheet-overlay.show{display:flex;}
  .sheet{
    background:var(--bg-1); width:100%; border-radius:20px 20px 0 0; padding:20px 18px calc(20px + var(--safe-b));
    border-top:1px solid var(--line); animation:sheetup .22s ease;
  }
  @keyframes sheetup{from{transform:translateY(30px); opacity:0} to{transform:none; opacity:1}}
  .sheet .s-name{font-weight:600; font-size:16px; margin-top:10px;}
  .sheet .s-price{color:var(--gold); font-family:'Space Grotesk'; font-weight:700; margin-top:2px;}
  .qty-row{display:flex; align-items:center; justify-content:center; gap:18px; margin:18px 0;}
  .qty-row button{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--bg-2);
    color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .qty-row .q-val{font-family:'Space Grotesk'; font-weight:700; font-size:20px; min-width:28px; text-align:center;}
  .accounts-box{
    background:var(--bg-2); border-radius:12px; padding:12px; margin-top:12px; font-size:12.5px;
    max-height:160px; overflow-y:auto; text-align:left;
  }
  .accounts-box div{padding:3px 0; word-break:break-all;}

  /* ---------- search ---------- */
  .search-box{
    display:flex; align-items:center; gap:9px; background:var(--bg-1); border:1px solid var(--line);
    border-radius:14px; padding:11px 14px; margin-bottom:14px; color:var(--ink-dim);
  }
  .search-box input{
    flex:1; background:none; border:none; outline:none; color:var(--ink); font-family:inherit; font-size:14px;
  }
  .search-box input::placeholder{color:var(--ink-dim);}

  /* ---------- admin ---------- */
  .admin-row{
    display:flex; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); align-items:center;
  }
  .admin-row:last-child{border-bottom:none;}
  .admin-row .a-name{font-weight:600; font-size:14px;}
  .admin-row .a-meta{font-size:11.5px; color:var(--ink-dim); margin-top:2px;}
  .admin-row .a-actions{display:flex; gap:6px; margin-left:auto;}
  .icon-btn{
    width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:var(--bg-2);
    color:var(--ink-dim); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn.danger{color:var(--danger); border-color:rgba(229,84,92,.35);}
  .icon-btn.accent{color:var(--gold); border-color:rgba(245,197,66,.35);}
  .fab{
    position:fixed; right:16px; bottom:calc(84px + var(--safe-b) + 12px); z-index:25;
    width:52px; height:52px; border-radius:50%; background:var(--violet); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(124,92,255,.4); cursor:pointer;
  }
  .field{margin-top:12px; text-align:left;}
  .field label{font-size:12px; color:var(--ink-dim); display:block; margin-bottom:6px;}
  .field input, .field textarea{
    width:100%; background:var(--bg-2); border:1px solid var(--line); border-radius:12px; color:var(--ink);
    padding:11px 12px; font-family:inherit; font-size:14px; resize:vertical;
  }
  .icon-pick{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .icon-pick .opt{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--bg-2);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-dim);
  }
  .icon-pick .opt.active{border-color:var(--gold); color:var(--gold); background:rgba(245,197,66,.08);}

  #toast{
    position:fixed; left:50%; top:calc(16px + var(--safe-t)); transform:translateX(-50%) translateY(-40px);
    background:var(--bg-2); border:1px solid var(--line); color:var(--ink); padding:11px 18px; border-radius:12px;
    font-size:13px; z-index:60; opacity:0; transition:all .25s ease; max-width:88%; text-align:center;
    display:flex; align-items:center; gap:8px;
  }
  #toast.show{transform:translateX(-50%) translateY(0); opacity:1;}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <div class="mark"><span class="dot"></span>Kairozen Store</div>
      <div class="sub">គណនី Premium ត្រឹមត្រូវ ១០០%</div>
    </div>
    <div class="wallet-chip" onclick="goto('wallet')">
      <span class="ic ic-18" data-icon="wallet"></span>
      <span class="amt num" id="chipBalance">$0.00</span>
    </div>
  </header>

  <main>
    <section class="view active" id="view-shop">
      <div class="search-box">
        <span class="ic ic-18" data-icon="search"></span>
        <input type="text" id="searchInput" placeholder="ស្វែងរកផលិតផល...">
      </div>
      <div class="section-title">ផលិតផលទាំងអស់</div>
      <div class="grid" id="productGrid"></div>
    </section>

    <section class="view" id="view-wallet">
      <div class="balance-hero">
        <div class="ring"></div>
        <div class="label">សមតុល្យ Wallet</div>
        <div class="value num" id="walletBalance">$0.00</div>
        <div class="ref" id="walletRef">ការកម្ម៉ង់សរុប៖ 0</div>
      </div>

      <div class="section-title">បញ្ចូលលុយចូល Wallet</div>
      <div class="chip-row" id="amtChips">
        <div class="amt-chip" data-v="2">$2</div>
        <div class="amt-chip" data-v="5">$5</div>
        <div class="amt-chip" data-v="10">$10</div>
        <div class="amt-chip" data-v="20">$20</div>
      </div>
      <div class="custom-amt">
        <input type="number" inputmode="decimal" id="customAmt" placeholder="ចំនួនផ្សេង (ឧ. 7.50)">
      </div>
      <button class="primary-btn" id="depositBtn" onclick="createDeposit()">
        <span class="ic ic-18" data-icon="qr-code"></span> បង្កើត KHQR ទូទាត់
      </button>

      <div id="ticketHost"></div>
    </section>

    <section class="view" id="view-orders">
      <div class="section-title">ប្រវត្តិការកម្ម៉ង់</div>
      <div id="ordersList"></div>
    </section>

    <section class="view" id="view-admin">
      <div class="section-title">គ្រប់គ្រង Product</div>
      <div id="adminProductList"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-view="shop" class="active" onclick="goto('shop')"><span class="ic ic-20" data-icon="shopping-cart"></span>ទំនិញ</button>
    <button data-view="wallet" onclick="goto('wallet')"><span class="ic ic-20" data-icon="wallet"></span>Wallet</button>
    <button data-view="orders" onclick="goto('orders')"><span class="ic ic-20" data-icon="receipt"></span>កម្ម៉ង់</button>
    <button data-view="admin" id="adminTabBtn" onclick="goto('admin')" style="display:none;"><span class="ic ic-20" data-icon="shield"></span>Admin</button>
  </nav>
</div>

<button class="fab" id="adminFab" style="display:none;" onclick="openProductForm()"><span class="ic ic-24" data-icon="plus"></span></button>

<div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this) closeSheet()">
  <div class="sheet" id="sheetBody"></div>
</div>

<div id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try{tg.setHeaderColor('#131A33');}catch(e){} }

function initData(){ return tg ? tg.initData : ''; }

/* ---------------- icon system ---------------- */
// map product emoji (set by admin in the bot's /addproduct + /setupemoji flow) to a
// matching Lucide icon so the storefront reads as one designed system, not mixed emoji.
const EMOJI_ICON_MAP = {
  '🤖':'bot', '🎬':'clapperboard', '🎧':'headphones', '📘':'book-open', '🎨':'palette',
  '🔑':'key-round', '🛍':'shopping-bag', '📦':'package', '💳':'credit-card', '🎮':'gamepad-2',
  '📱':'smartphone', '🎵':'music-2', '📺':'tv', '☁️':'cloud', '🖼':'image', '📄':'file-text',
  '⭐':'star', '💎':'gem', '📷':'camera', '✉️':'mail', '🌐':'globe',
};
const ICON_CHOICES = ['bot','clapperboard','headphones','book-open','palette','key-round','shopping-bag',
  'package','credit-card','gamepad-2','smartphone','music-2','tv','cloud','image','file-text','star','gem',
  'camera','mail','globe','sparkles','shield','zap','crown'];
function productIconName(val){
  if (!val) return 'sparkles';
  if (EMOJI_ICON_MAP[val]) return EMOJI_ICON_MAP[val];
  // admin-added products store a Lucide icon name directly (no emoji involved)
  return ICON_CHOICES.includes(val) ? val : 'sparkles';
}
function ic(name){ return `<span class="ic" data-icon="${name}"></span>`; }
function renderIcons(){
  document.querySelectorAll('[data-icon]').forEach(el=>{
    el.setAttribute('data-lucide', el.getAttribute('data-icon'));
    el.removeAttribute('data-icon');
  });
  if (window.lucide) lucide.createIcons();
}

function toast(msg, iconName){
  const t = document.getElementById('toast');
  t.innerHTML = (iconName ? ic(iconName) : '') + `<span>${msg}</span>`;
  renderIcons();
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2600);
}

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({'Content-Type':'application/json','X-Telegram-Init-Data': initData()}, opts.headers||{});
  const res = await fetch(path, opts);
  let data = {};
  try { data = await res.json(); } catch(e){}
  return data;
}

function money(n){ return '$' + (Number(n)||0).toFixed(2); }
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

/* ---------------- navigation ---------------- */
function goto(view){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  if (view === 'wallet') loadMe();
  if (view === 'orders') loadOrders();
  if (view === 'admin') loadAdminProducts();
  document.getElementById('adminFab').style.display = (view === 'admin' && IS_ADMIN) ? 'flex' : 'none';
}

/* ---------------- products ---------------- */
let PRODUCTS = [];
async function loadProducts(){
  const data = await api('/api/products');
  PRODUCTS = data.products || [];
  renderProductGrid();
}
function renderProductGrid(){
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const list = q ? PRODUCTS.filter(p => p.name.toLowerCase().includes(q)) : PRODUCTS;
  const grid = document.getElementById('productGrid');
  if (!list.length){
    grid.innerHTML = `<div class="empty">${ic('package-search')}<div>${q ? 'រកមិនឃើញផលិតផលត្រូវនឹងការស្វែងរក' : 'មិនទាន់មានផលិតផលទេ'}</div></div>`;
    renderIcons();
    return;
  }
  grid.innerHTML = list.map(p => {
    const low = p.stock > 0 && p.stock <= 3;
    const out = p.stock <= 0;
    return `<div class="card">
      ${p.image ? `<img class="card-img" src="${p.image}" alt="">` : `<div class="icon-tile">${ic(productIconName(p.icon))}</div>`}
      <div class="name">${escapeHtml(p.name)}</div>
      <span class="stock-pill ${low||out?'low':''}">${ic(out?'ban':'boxes')}${out ? 'អស់ស្តុក' : 'នៅសល់ ' + p.stock}</span>
      <div class="meta"><span class="price num">${money(p.price)}</span></div>
      <button class="buy-btn" ${out?'disabled':''} onclick="openBuySheet('${p.key}')">
        ${ic(out ? 'ban' : 'shopping-cart')} ${out?'អស់ស្តុក':'ទិញ'}
      </button>
    </div>`;
  }).join('');
  renderIcons();
}

/* ---------------- buy sheet ---------------- */
let buyQty = 1, buyProduct = null;
function openBuySheet(key){
  buyProduct = PRODUCTS.find(p => p.key === key);
  if (!buyProduct) return;
  buyQty = 1;
  renderBuySheet();
  document.getElementById('sheetOverlay').classList.add('show');
}
function closeSheet(){ document.getElementById('sheetOverlay').classList.remove('show'); }
function renderBuySheet(){
  const p = buyProduct;
  document.getElementById('sheetBody').innerHTML = `
    ${p.image ? `<img class="card-img" style="max-width:160px;margin:0 auto;" src="${p.image}" alt="">` : `<div class="icon-tile" style="width:56px;height:56px;font-size:26px;">${ic(productIconName(p.icon))}</div>`}
    <div class="s-name">${escapeHtml(p.name)}</div>
    <div class="s-price num">${money(p.price)} / ១</div>
    <div class="qty-row">
      <button onclick="stepQty(-1)">${ic('minus')}</button>
      <div class="q-val num">${buyQty}</div>
      <button onclick="stepQty(1)">${ic('plus')}</button>
    </div>
    <div style="text-align:center;color:var(--ink-dim);font-size:12.5px;margin-bottom:6px;">សរុប: <span class="num" style="color:var(--gold);font-weight:700;">${money(p.price*buyQty)}</span> · ស្តុកមាន ${p.stock}</div>
    <button class="primary-btn" onclick="confirmBuy()">${ic('check-circle')} បញ្ជាក់ការទិញ</button>
  `;
  renderIcons();
}
function stepQty(d){
  const next = buyQty + d;
  if (next < 1 || next > buyProduct.stock) return;
  buyQty = next;
  renderBuySheet();
}
async function confirmBuy(){
  const res = await api('/api/order', {method:'POST', body: JSON.stringify({product_key: buyProduct.key, qty: buyQty})});
  if (res.ok){
    document.getElementById('sheetBody').innerHTML = `
      <div class="icon-tile" style="width:56px;height:56px;font-size:26px;color:var(--success);">${ic('check-circle-2')}</div>
      <div class="s-name">ការទិញជោគជ័យ!</div>
      <div class="accounts-box">${res.items.map((it,i)=>`<div>${i+1}. ${escapeHtml(it)}</div>`).join('')}</div>
      <button class="primary-btn" onclick="closeSheet(); loadProducts(); loadMe();">${ic('check')} រួចរាល់</button>
    `;
    renderIcons();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  } else {
    const errMap = {
      out_of_stock: 'ស្តុកមិនគ្រប់គ្រាន់ទេ', insufficient_balance: 'សមតុល្យ Wallet មិនគ្រប់គ្រាន់ សូមបញ្ចូលលុយមុន',
      out_of_stock_race: 'ស្តុកអស់ភ្លាមៗ សូមព្យាយាមម្តងទៀត', product_not_found: 'រកមិនឃើញផលិតផលនេះទេ',
    };
    toast(errMap[res.error] || 'មានបញ្ហា សូមព្យាយាមម្តងទៀត', 'circle-alert');
    if (res.error === 'insufficient_balance'){ closeSheet(); goto('wallet'); }
  }
}

/* ---------------- wallet ---------------- */
let IS_ADMIN = false;
async function loadMe(){
  const res = await api('/api/me');
  if (!res.ok) return;
  document.getElementById('chipBalance').textContent = money(res.balance);
  document.getElementById('walletBalance').textContent = money(res.balance);
  document.getElementById('walletRef').textContent = `ការកម្ម៉ង់សរុប៖ ${res.orders} · ណែនាំបានប្រាក់៖ ${money(res.ref_earned)}`;
  if (res.is_admin && !IS_ADMIN){
    IS_ADMIN = true;
    document.getElementById('adminTabBtn').style.display = '';
  }
}

let chosenAmt = 5;
document.getElementById('amtChips').addEventListener('click', (e)=>{
  const chip = e.target.closest('.amt-chip');
  if (!chip) return;
  document.querySelectorAll('.amt-chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  chosenAmt = Number(chip.dataset.v);
  document.getElementById('customAmt').value = '';
});
document.getElementById('customAmt').addEventListener('input', ()=>{
  document.querySelectorAll('.amt-chip').forEach(c=>c.classList.remove('active'));
});

let pollTimer = null;
async function createDeposit(){
  const custom = parseFloat(document.getElementById('customAmt').value);
  const amount = custom > 0 ? custom : chosenAmt;
  document.getElementById('depositBtn').disabled = true;
  const res = await api('/api/deposit', {method:'POST', body: JSON.stringify({amount})});
  document.getElementById('depositBtn').disabled = false;
  if (!res.ok){
    const errMap = {no_manual_qr_configured:'ហាងមិនទាន់កំណត់ QR ទូទាត់ទេ សូមទាក់ទង Admin', gateway_error:'Gateway ទូទាត់មានបញ្ហា សូមព្យាយាមម្តងទៀត'};
    toast(errMap[res.error] || 'មិនអាចបង្កើត QR បានទេ', 'circle-alert');
    return;
  }
  renderTicket(res, amount);
  clearInterval(pollTimer);
  pollTimer = setInterval(()=>pollDeposit(res.dep_id), 3500);
}

function renderTicket(dep, amount){
  document.getElementById('ticketHost').innerHTML = `
    <div class="ticket">
      <div class="notch l"></div><div class="notch r"></div>
      <div class="store">KAIROZEN STORE · KHQR</div>
      <div class="amt num">${money(amount)}</div>
      <img src="${dep.qr_url}" alt="KHQR">
      <div class="refid mono">REF ${dep.dep_id}</div>
      <div class="perf"></div>
      <div class="status-line" id="depStatus"><div class="spinner"></div> កំពុងរង់ចាំការទូទាត់...</div>
    </div>
  `;
}

async function pollDeposit(depId){
  const res = await api('/api/deposit/status?dep_id=' + encodeURIComponent(depId));
  const el = document.getElementById('depStatus');
  if (!el) { clearInterval(pollTimer); return; }
  if (res.status === 'approved'){
    clearInterval(pollTimer);
    el.className = 'status-line ok';
    el.innerHTML = ic('check-circle-2') + ' ទូទាត់ជោគជ័យ! បានបញ្ចូលចូល Wallet';
    renderIcons();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    loadMe();
  } else if (res.status === 'rejected'){
    clearInterval(pollTimer);
    el.className = 'status-line fail';
    el.innerHTML = ic('x-circle') + ' ការទូទាត់មិនត្រូវបានបញ្ជាក់ទេ';
    renderIcons();
  }
}

/* ---------------- orders ---------------- */
async function loadOrders(){
  const res = await api('/api/orders');
  const host = document.getElementById('ordersList');
  const orders = res.orders || [];
  if (!orders.length){
    host.innerHTML = `<div class="empty">${ic('receipt')}<div>មិនទាន់មានការកម្ម៉ង់ណាមួយទេ</div></div>`;
    renderIcons();
    return;
  }
  host.innerHTML = orders.map(o => `
    <div class="order-row">
      <span class="ic ic-20" style="color:var(--gold);" data-icon="receipt-text"></span>
      <div>
        <div class="o-name">${escapeHtml(o.product)} ${o.qty>1?('× '+o.qty):''}</div>
        <div class="o-meta">${o.time}</div>
      </div>
      <div class="o-price num">${money(o.price)}</div>
    </div>
  `).join('');
  renderIcons();
}

document.getElementById('searchInput').addEventListener('input', renderProductGrid);

/* ---------------- admin: product & stock management ---------------- */
async function loadAdminProducts(){
  const res = await api('/api/admin/products');
  const host = document.getElementById('adminProductList');
  if (!res.ok){
    host.innerHTML = `<div class="empty">${ic('shield-x')}<div>គ្មានសិទ្ធិចូលមើលទំព័រនេះទេ</div></div>`;
    renderIcons();
    return;
  }
  const list = res.products || [];
  if (!list.length){
    host.innerHTML = `<div class="empty">${ic('package-search')}<div>មិនទាន់មាន product ទេ · ចុច + ដើម្បីបន្ថែម</div></div>`;
    renderIcons();
    return;
  }
  host.innerHTML = list.map(p => `
    <div class="admin-row">
      ${p.image ? `<img class="thumb-sm" src="${p.image}" alt="">` : `<div class="icon-tile" style="width:38px;height:38px;font-size:17px;">${ic(productIconName(p.icon))}</div>`}
      <div>
        <div class="a-name">${escapeHtml(p.name)}</div>
        <div class="a-meta">${money(p.price)} · ស្តុក ${p.stock} · លក់ ${p.sold||0}</div>
      </div>
      <div class="a-actions">
        <button class="icon-btn accent" onclick="openStockForm('${p.key}')" title="Stock">${ic('package-plus')}</button>
        <button class="icon-btn" onclick="openProductForm('${p.key}')" title="Edit">${ic('pencil')}</button>
        <button class="icon-btn danger" onclick="deleteProduct('${p.key}')" title="Delete">${ic('trash-2')}</button>
      </div>
    </div>
  `).join('');
  renderIcons();
}

let pfImageData = null;
function openProductForm(key){
  const p = key ? PRODUCTS.find(x => x.key === key) : null;
  const iconVal = p ? productIconName(p.icon) : 'sparkles';
  pfImageData = null;
  document.getElementById('sheetBody').innerHTML = `
    <div class="s-name">${p ? 'កែ Product' : 'Product ថ្មី'}</div>
    <div class="field"><label>Key (លេខសម្គាល់ ឧ. netflix)</label>
      <input id="pfKey" value="${p ? p.key : ''}" ${p ? 'disabled' : ''} placeholder="ឧ. chatgpt">
    </div>
    <div class="field"><label>ឈ្មោះ Product</label>
      <input id="pfName" value="${p ? escapeHtml(p.name) : ''}" placeholder="ឧ. ChatGPT Plus 1 Month">
    </div>
    <div class="field"><label>តម្លៃ ($)</label>
      <input id="pfPrice" type="number" inputmode="decimal" value="${p ? p.price : ''}" placeholder="ឧ. 8.00">
    </div>
    <div class="field"><label>រូបភាព (ស្រេចចិត្ត — បើគ្មាន នឹងប្រើ icon)</label>
      <div class="img-upload">
        ${p && p.image ? `<img class="preview" id="pfImgPreview" src="${p.image}">` : `<img class="preview" id="pfImgPreview" style="display:none;">`}
        <label for="pfImgFile">${ic('upload')} ជ្រើសរូបភាព</label>
        <input type="file" id="pfImgFile" accept="image/png,image/jpeg,image/webp" onchange="onPickImage(event)">
      </div>
    </div>
    <div class="field"><label>Icon (ប្រើពេលគ្មានរូបភាព)</label>
      <div class="icon-pick" id="pfIconPick"></div>
    </div>
    <button class="primary-btn" onclick="saveProduct('${key||''}')">${ic('check')} រក្សាទុក</button>
  `;
  const pick = document.getElementById('pfIconPick');
  pick.innerHTML = ICON_CHOICES.map(n => `<div class="opt ${n===iconVal?'active':''}" data-icon-opt="${n}" onclick="pickIcon('${n}')">${ic(n)}</div>`).join('');
  renderIcons();
  document.getElementById('sheetOverlay').classList.add('show');
}
function onPickImage(e){
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 3*1024*1024){ toast('រូបភាពធំពេក (កំណត់ 3MB)', 'circle-alert'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    pfImageData = reader.result;
    const prev = document.getElementById('pfImgPreview');
    prev.src = pfImageData;
    prev.style.display = '';
  };
  reader.readAsDataURL(file);
}
function pickIcon(name){
  document.querySelectorAll('#pfIconPick .opt').forEach(el => el.classList.toggle('active', el.dataset.iconOpt === name));
}
async function saveProduct(existingKey){
  const key = document.getElementById('pfKey').value.trim();
  const name = document.getElementById('pfName').value.trim();
  const price = document.getElementById('pfPrice').value;
  const activeIcon = document.querySelector('#pfIconPick .opt.active');
  const icon = activeIcon ? activeIcon.dataset.iconOpt : 'sparkles';
  if (!key || !name || !price){ toast('សូមបំពេញគ្រប់ field', 'circle-alert'); return; }
  const res = await api('/api/admin/product', {method:'POST', body: JSON.stringify({key, name, price, icon})});
  if (!res.ok){ toast('មិនអាចរក្សាទុកបានទេ', 'circle-alert'); return; }
  if (pfImageData){
    const imgRes = await api('/api/admin/product-image', {method:'POST', body: JSON.stringify({product_key: key, image_data: pfImageData})});
    if (!imgRes.ok) toast('រក្សាទុក product បាន ប៉ុន្តែ upload រូបភាពមិនជោគជ័យ', 'circle-alert');
  }
  toast('រក្សាទុករួចរាល់', 'check-circle');
  closeSheet();
  loadAdminProducts();
  loadProducts();
}
async function deleteProduct(key){
  if (!confirm('លុប product នេះ? Stock ដែលនៅសល់ក៏នឹងត្រូវលុបផងដែរ។')) return;
  const res = await api('/api/admin/product/' + encodeURIComponent(key), {method:'DELETE'});
  if (res.ok){ toast('បានលុប', 'check-circle'); loadAdminProducts(); loadProducts(); }
  else toast('មិនអាចលុបបានទេ', 'circle-alert');
}

function openStockForm(key){
  const p = PRODUCTS.find(x => x.key === key);
  document.getElementById('sheetBody').innerHTML = `
    <div class="s-name">បន្ថែម Stock — ${p ? escapeHtml(p.name) : key}</div>
    <div class="field"><label>Account (មួយបន្ទាត់ = មួយ account)</label>
      <textarea id="sfItems" rows="6" placeholder="user1@mail.com:pass1\nuser2@mail.com:pass2"></textarea>
    </div>
    <button class="primary-btn" onclick="addStock('${key}')">${ic('package-plus')} បន្ថែម Stock</button>
    <button class="primary-btn" style="background:var(--danger); margin-top:8px;" onclick="clearStock('${key}')">${ic('trash-2')} លុប Stock ទាំងអស់</button>
  `;
  renderIcons();
  document.getElementById('sheetOverlay').classList.add('show');
}
async function addStock(key){
  const items = document.getElementById('sfItems').value;
  if (!items.trim()){ toast('សូមបញ្ចូល account យ៉ាងតិចមួយ', 'circle-alert'); return; }
  const res = await api('/api/admin/stock', {method:'POST', body: JSON.stringify({product_key: key, items})});
  if (res.ok){
    toast(`បានបន្ថែម ${res.added} account`, 'check-circle');
    closeSheet();
    loadAdminProducts();
    loadProducts();
  } else {
    toast('មិនអាចបន្ថែម stock បានទេ', 'circle-alert');
  }
}
async function clearStock(key){
  if (!confirm('លុប stock ទាំងអស់នៃ product នេះ?')) return;
  const res = await api('/api/admin/stock/remove', {method:'POST', body: JSON.stringify({product_key: key, clear: true})});
  if (res.ok){
    toast(`បានលុប ${res.removed} account`, 'check-circle');
    closeSheet();
    loadAdminProducts();
    loadProducts();
  } else {
    toast('មិនអាចលុប stock បានទេ', 'circle-alert');
  }
}

/* ---------------- boot ---------------- */
renderIcons(); // static header/tabbar icons
loadProducts();
loadMe();
</script>
